adapter driver ftdi
# LiteX's OpenOCD stream helper uses the Cyclone-IV-compatible USER1
# instruction (0x0e) for Cyclone 10 LP as well; keep the ep4ce marker here
# so its family detector selects that opcode.
# ep4ce
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b

adapter speed 3000
transport select jtag
reset_config none

set _CHIPNAME cyc1000
jtag newtap $_CHIPNAME tap -irlen 10 -expected-id 0x020f30dd
