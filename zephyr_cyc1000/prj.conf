CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="cyc1000:~$ "
CONFIG_SHELL_STACK_SIZE=2048

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6_PE=y
# Link-local, stable SLAAC and two temporary privacy addresses during rotation.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SHELL=y
CONFIG_ETH_LITEX_LITEETH=y
CONFIG_MDIO_LITEX_LITEETH=y
CONFIG_ETH_PHY_DRIVER=y
CONFIG_PHY_GENERIC_MII=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_OBJ_CORE=y
CONFIG_NET_SOCKETS_OBJ_CORE=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS_POLL_MAX=8
# LiteX CYC1000 has no hardware entropy source yet; sufficient for IPv4/ARP
# bring-up, but not for cryptographic protocols.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
# LittleFS automount (and a format of an empty partition) runs in POST_KERNEL
# init on the main stack; 1 KiB overflows during lfs_format.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_LOG=y
# Button feedback is interactive; deferred logging can otherwise hold records
# until the logging thread gets CPU time and print them in a burst.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_GPIO=y
CONFIG_INPUT=y
# Deliver the gpio-keys event from its 30 ms debounce work item instead of
# queueing it for the input thread; button feedback must not wait for startup.
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_GPIO_KEYS=y

# LittleFS in the last 256 KiB of the SPI configuration flash, mounted at /lfs.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FLASH_SHELL=y
