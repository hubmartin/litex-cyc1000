CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="cyc1000:~$ "
CONFIG_SHELL_STACK_SIZE=2048

# Ethernet belongs only to LiteX Etherbone in this initial bring-up.
CONFIG_NETWORKING=n
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
