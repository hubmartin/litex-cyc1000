CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="cyc1000:~$ "
CONFIG_SHELL_STACK_SIZE=2048

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6_PE=y
# Link-local, stable SLAAC and two temporary privacy addresses during rotation.
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=4
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SHELL=y
CONFIG_ETH_LITEX_LITEETH=y
CONFIG_MDIO_LITEX_LITEETH=y
CONFIG_ETH_PHY_DRIVER=y
CONFIG_PHY_GENERIC_MII=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_OBJ_CORE=y
CONFIG_NET_SOCKETS_OBJ_CORE=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
CONFIG_NET_SOCKETS=y
CONFIG_MQTT_LIB=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS_POLL_MAX=8
# LiteX CYC1000 has no hardware entropy source yet; sufficient for IPv4/ARP
# bring-up, but not for cryptographic protocols.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_LOG=y
# Serialize records from both periodic threads through Zephyr's log-processing
# thread before they reach the UART shell backend.
CONFIG_LOG_MODE_DEFERRED=y
# Wake the logger as soon as a record arrives. This keeps button feedback near
# the 30 ms gpio-keys debounce time instead of the default one-second poll.
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
